<VirtualHost *:80>
    ServerName ___default___ 
    Redirect 404 /
</VirtualHost>

<VirtualHost *:80>
    ServerName localhost

    DocumentRoot "/Users/test/Sites/localhost"

    <IfModule xsendfile_module>
        XSendFilePath "/Users/test/Sites/localhost"
    </IfModule>

    <Directory "/Users/test/Sites/localhost">
        Options Includes FollowSymLinks
        AllowOverride All
        <IfModule authz_host_module>
            Require all granted
        </IfModule>
    </Directory>

    AddHandler php-fastcgi .php
    Action php-fastcgi "/fcgi-bin/php8.3.14.fcgi"
</VirtualHost>

