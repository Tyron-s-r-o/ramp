#
# Anonymized fixture derived from the structure of a MAMP PRO 7.2.8 generated httpd.conf (plan 07-03).
# No real paths or domains.
#
ServerRoot "/Applications/MAMP/Library"
Listen 80

<IfModule mod_fastcgi.c>
    # URIs that begin with /fcgi-bin/, are found in /var/www/fcgi-bin/
    Alias /fcgi-bin/ "/Applications/MAMP/fcgi-bin/"
    <Directory "/Applications/MAMP/fcgi-bin/">
        SetHandler fastcgi-script
        Options +ExecCGI
    </Directory>
    AddHandler fastcgi-script .fcgi .fpl
    FastCgiIpcDir /Applications/MAMP/Library/logs/fastcgi
    FastCgiServer /Applications/MAMP/fcgi-bin/php8.1.31.fcgi -socket fgci8.1.31.sock
    FastCgiServer /Applications/MAMP/fcgi-bin/php7.3.33.fcgi -socket fgci7.3.33.sock
    FastCgiServer /Applications/MAMP/fcgi-bin/php8.3.14.fcgi -socket fgci8.3.14.sock
    <IfModule mod_setenvif.c>
        SetEnvIf Authorization "(.+)" HTTP_AUTHORIZATION=$1
    </IfModule>
</IfModule>

