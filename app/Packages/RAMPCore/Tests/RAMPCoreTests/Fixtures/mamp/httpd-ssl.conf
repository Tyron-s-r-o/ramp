#
# Anonymized fixture derived from a MAMP PRO generated httpd-ssl.conf (plan 07-03).
#
Listen 443
SSLPassPhraseDialog  builtin
SSLSessionCacheTimeout    300

<VirtualHost *:443>
    ServerName ___default___ 
    SSLEngine on
    SSLCertificateFile "/Applications/MAMP/conf/server/default.crt"
    SSLCertificateKeyFile "/Applications/MAMP/conf/server/default.key"
    Redirect 404 /
</VirtualHost>

SSLStrictSNIVHostCheck off

<VirtualHost *:443>
    ServerName secure-a.local

    DocumentRoot "/Users/test/Sites/secure-a/api/public"

    <IfModule xsendfile_module>
        XSendFilePath "/Users/test/Sites/secure-a/api/public"
    </IfModule>

    SSLEngine on

    #SSLProtocol -all +TLSv1.3 +TLSv1.2
    #<IfModule mod_headers.c>
    #    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    #</IfModule>

    ErrorLog "/Applications/MAMP/logs/apache_ssl_error.log"
    CustomLog "/Applications/MAMP/logs/apache_ssl_request.log" "%t %h %{SSL_PROTOCOL}x %{SSL_CIPHER}x \"%r\" %b"

    SSLCertificateFile "/Applications/MAMP/Library/OpenSSL/certs/secure-a.local.crt"
    SSLCertificateKeyFile "/Applications/MAMP/Library/OpenSSL/certs/secure-a.local.key"

    <FilesMatch "\.(cgi|shtml|phtml|php)$">
        SSLOptions +StdEnvVars
    </FilesMatch>

    BrowserMatch ".*MSIE.*" \
         nokeepalive ssl-unclean-shutdown \
         downgrade-1.0 force-response-1.0

    <Directory "/Users/test/Sites/secure-a/api/public">
        Options Includes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    AddHandler php-fastcgi .php
    Action php-fastcgi "/fcgi-bin/php7.3.33.fcgi"
</VirtualHost>

