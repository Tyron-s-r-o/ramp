name: RAMP

options:
  bundleIdPrefix: sk.tyron
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  # Slovak is the source language of the String Catalog (English = translation), plan 05-01.
  developmentLanguage: sk

packages:
  RAMPCore:
    path: Packages/RAMPCore
  # App self-update (08-03). Exact pin = build/versions.env SPARKLE_VERSION (THIRD_PARTY_LICENSES).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

settings:
  base:
    SWIFT_VERSION: "6"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    VALID_ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SUPPORTS_MACCATALYST: NO
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    # Tyron s.r.o. company team (Apple Development for Debug; Developer ID is Phase 8).
    CODE_SIGN_IDENTITY: "Apple Development"
    DEVELOPMENT_TEAM: S25RFUK37U
  # Release = Developer ID (08-03): manual style, secure timestamp. Debug stays Apple Development/automatic.
  # app/scripts/release-app.sh --dry-run overrides these on the command line (no Developer ID cert yet).
  configs:
    Release:
      CODE_SIGN_STYLE: Manual
      CODE_SIGN_IDENTITY: "Developer ID Application"
      OTHER_CODE_SIGN_FLAGS: "--timestamp"

targets:
  RAMP:
    type: application
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: RAMP
        excludes:
          - LaunchDaemons/**
          - Info.plist
          - "*.xcconfig"
      # launchd plist for SMAppService.daemon — Contents/Library/LaunchDaemons, no code sign on copy.
      - path: RAMP/LaunchDaemons/sk.tyron.ramp.hostshelper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      # Settings › O aplikácii › Licencie tretích strán (08-04 generated file), plan 05-06.
      - path: ../THIRD_PARTY_LICENSES.md
        buildPhase: resources
    # SUFeedURL / SUPublicEDKey / default manifest URL / build number (08-03)
    configFiles:
      Debug: RAMP/Distribution.xcconfig
      Release: RAMP/Distribution.xcconfig
    dependencies:
      - package: RAMPCore
      - package: Sparkle   # 08-03
      # Privileged helper → Contents/MacOS/sk.tyron.ramp.hostshelper (code sign on copy).
      - target: RAMPHostsHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: RAMP
        PRODUCT_BUNDLE_IDENTIFIER: sk.tyron.ramp
        CODE_SIGN_ENTITLEMENTS: RAMP/RAMP.entitlements
        GENERATE_INFOPLIST_FILE: YES
        # custom keys (SU*, RAMPDefaultManifestURL) merged into the generated plist (08-03)
        INFOPLIST_FILE: RAMP/Info.plist
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Tyron s.r.o."
        # RAMP/AppIcon.icon (Icon Composer, layers in design/icon-layers/) wins over Assets.xcassets/AppIcon.appiconset
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "$(RAMP_BUILD_NUMBER)"   # Distribution.xcconfig; release-app.sh --build
    scheme:
      testTargets: []
      gatherCoverageData: false
      # Dev: first launch installs packages from the local Phase 1 build (ramp.json without manifestURL).
      environmentVariables:
        RAMP_DEV_MANIFEST: file://$(SRCROOT)/../build/dist/manifest.json

  RAMPHostsHelper:
    type: tool
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: RAMPHostsHelper
        excludes:
          - Info.plist
          - "*.entitlements"
    dependencies:
      - package: RAMPCore
        product: RAMPHostsKit
    settings:
      base:
        PRODUCT_NAME: sk.tyron.ramp.hostshelper
        PRODUCT_BUNDLE_IDENTIFIER: sk.tyron.ramp.hostshelper
        INFOPLIST_FILE: RAMPHostsHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: RAMPHostsHelper/RAMPHostsHelper.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

schemes:
  RAMP:
    build:
      targets:
        RAMP: all
    run:
      config: Debug
    archive:
      config: Release
